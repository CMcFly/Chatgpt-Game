name: Prototype Smoke Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check src/game.js
      - name: Verify required files
        run: test -f index.html && test -f styles.css && test -f src/game.js
