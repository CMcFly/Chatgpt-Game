<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Emberwild — RPG Prototype</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="src/v2.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">CHATGPT GAME PROTOTYPE</div>
        <h1>EMBERWILD</h1>
      </div>
      <div id="hud" class="hud"></div>
    </header>

    <main class="game-shell">
      <section class="canvas-wrap">
        <canvas id="game" width="960" height="640" aria-label="Emberwild game world"></canvas>
        <div id="toast" class="toast hidden"></div>
        <div id="interaction" class="interaction hidden"></div>
      </section>

      <aside class="sidebar">
        <section class="panel">
          <h2>Journey</h2>
          <div id="quest"></div>
        </section>
        <section class="panel">
          <h2>Controls</h2>
          <div class="control-grid">
            <span>Move</span><b>WASD / Arrows</b>
            <span>Interact</span><b>E</b>
            <span>Inventory</span><b>I</b>
            <span>Character</span><b>C</b>
            <span>Save</span><b>Auto</b>
          </div>
        </section>
        <section class="panel muted-panel">
          <h2>Emberwild</h2>
          <p>Wake on the unmapped Hollowpath → learn the basics → survive what you can → reach Hearthcross → repay your debt → rebuild a foothold in Mossroad Vale.</p>
        </section>
      </aside>
    </main>
  </div>

  <div id="overlay" class="overlay hidden"></div>

  <script>
    (() => {
      const prologueDone = localStorage.getItem('emberwild-prologue-v1');
      const skipOnce = sessionStorage.getItem('emberwild-skip-prologue-once');
      if (skipOnce) sessionStorage.removeItem('emberwild-skip-prologue-once');
      const script = document.createElement('script');
      script.src = (prologueDone || skipOnce) ? 'src/game-v2.js' : 'src/prologue.js';
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
