<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Emberwild — RPG Prototype</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="src/v2.css" />
  <link rel="stylesheet" href="src/system-ui.css" />
</head>
<body>
  <div id="app" class="game-app">
    <main class="game-stage">
      <section class="canvas-wrap system-canvas-wrap">
        <canvas id="game" width="960" height="640" aria-label="Emberwild game world"></canvas>

        <div class="system-top-left" aria-label="Player status">
          <div class="system-label">SYSTEM // STATUS</div>
          <div id="hud" class="hud system-hud"></div>
        </div>

        <aside id="quest" class="system-objective" aria-label="Tracked journal objective"></aside>
        <div id="system-notifications" class="system-notifications" aria-live="polite"></div>
        <div id="toast" class="toast hidden" aria-live="polite"></div>
        <div id="interaction" class="interaction hidden"></div>

        <nav id="system-dock" class="system-dock" aria-label="System menus">
          <button type="button" class="system-dock-button" data-system-action="inventory" title="Inventory (I)">
            <span class="system-dock-icon" aria-hidden="true">▰</span><kbd>I</kbd><span class="system-dock-name">Inventory</span>
          </button>
          <button type="button" class="system-dock-button" data-system-action="character" title="Character (C)">
            <span class="system-dock-icon" aria-hidden="true">♜</span><kbd>C</kbd><span class="system-dock-name">Character</span>
          </button>
          <button type="button" class="system-dock-button" data-system-action="journal" title="System Journal (J)">
            <span class="system-dock-icon" aria-hidden="true">▤</span><kbd>J</kbd><span class="system-dock-name">Journal</span>
          </button>
          <button type="button" class="system-dock-button" data-system-action="map" title="Map (M)">
            <span class="system-dock-icon" aria-hidden="true">⌖</span><kbd>M</kbd><span class="system-dock-name">Map</span>
          </button>
          <button type="button" class="system-dock-button system-dock-menu" data-system-action="pause" title="System Menu (Esc)">
            <span class="system-dock-icon" aria-hidden="true">☰</span><kbd>ESC</kbd><span class="system-dock-name">Menu</span>
          </button>
        </nav>
      </section>
    </main>
  </div>

  <div id="overlay" class="overlay hidden"></div>
  <div id="system-menu-layer" class="system-menu-layer hidden" aria-hidden="true"></div>

  <script src="src/assets.js"></script>
  <script src="src/death-ui.js"></script>
  <script src="src/system-ui.js"></script>
  <script src="src/main-menu.js"></script>
</body>
</html>
